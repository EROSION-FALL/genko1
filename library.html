<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>イントロ→ループ テスト</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#020005;color:#f0d0e8;
  font-family:'RocknRoll One',-apple-system,sans-serif;
}

#game{
  position:relative;
  width:100%;height:100dvh;
  max-width:480px;margin:0 auto;
  background:#05020a;
  overflow:hidden;
}
@media (min-width: 768px){
  #game{ max-width:720px; }
}

.screen{
  position:absolute;inset:0;
  display:none;
}
.screen.active{display:block}

/* ===== イントロ画面 ===== */
#introScreen{
  background:#000;
  z-index:200;
}
#introVideo{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}

/* ===== 起動画面 ===== */
#startScreen{
  background:#000;
  position:relative;
}
#startBgVideo{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  z-index:0;
  opacity:0.5;
}
#startScreen::after{
  content:"";
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.8) 100%);
  z-index:1;
  pointer-events:none;
}

#startUI{
  position:absolute;inset:0;
  z-index:2;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  opacity:0;
  transition:opacity 1.5s ease;
}
#startUI.visible{opacity:1}

#startUI h1{
  font-size:22px;
  color:#ff69b4;
  letter-spacing:4px;
  text-shadow:0 0 20px rgba(255,0,120,0.8);
  margin-bottom:12px;
}
#startUI p{
  font-size:12px;
  color:#ffcce6;
  letter-spacing:4px;
  margin-bottom:40px;
  opacity:0.85;
  text-shadow:0 0 8px rgba(0,0,0,0.8);
}
#folderButton{
  padding:16px 40px;
  border:1.5px solid #ff66aa;
  border-radius:4px;
  background:linear-gradient(180deg,#c01860,#500825);
  color:#fff;
  font-size:14px;font-weight:700;
  cursor:pointer;
  letter-spacing:2px;
  box-shadow:0 0 20px rgba(255,0,120,0.5);
}
#folderButton:active{transform:scale(0.97)}

/* ===== デバッグ ===== */
#debugBox{
  position:fixed;bottom:6px;left:6px;right:6px;
  background:rgba(0,0,0,0.85);
  color:#0f0;
  font-size:10px;
  padding:6px;
  border-radius:4px;
  z-index:99999;
  font-family:monospace;
  line-height:1.4;
  white-space:pre-wrap;
  display:none;
}
</style>
</head>
<body>
<div id="game">

  <!-- ① イントロ画面 -->
  <div id="introScreen" class="screen active">
    <video id="introVideo" playsinline muted preload="auto"></video>
  </div>

  <!-- ② 起動画面 -->
  <div id="startScreen" class="screen">
    <video id="startBgVideo" muted loop playsinline preload="auto"></video>
    <div id="startUI">
      <h1>SHRIFT : CRISIS</h1>
      <p>物語を選んでください</p>
      <button id="folderButton">📁 フォルダを選択</button>
    </div>
  </div>

  <div id="debugBox"></div>
</div>

<script>
"use strict";

// ===== 要素 =====
const introScreen = document.getElementById("introScreen");
const startScreen = document.getElementById("startScreen");
const introVideo = document.getElementById("introVideo");
const startBgVideo = document.getElementById("startBgVideo");
const startUI = document.getElementById("startUI");
const folderButton = document.getElementById("folderButton");
const debugBox = document.getElementById("debugBox");

// ===== 画面切替 =====
function showScreen(name){
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  const el = document.getElementById(name + "Screen");
  if (el) el.classList.add("active");
}

// ===== スリープ =====
function sleep(ms){
  return new Promise(r => setTimeout(r, ms));
}

// ===== デバッグ =====
function log(msg){
  console.log(msg);
  debugBox.textContent += msg + "\n";
}
function resetLog(){
  debugBox.textContent = "";
}

// ===== 状態監視 =====
setInterval(() => {
  const lines = [];
  lines.push("intro: ready=" + introVideo.readyState + " paused=" + introVideo.paused);
  lines.push("startBg: ready=" + startBgVideo.readyState + " paused=" + startBgVideo.paused);
  debugBox.setAttribute("data-status", lines.join(" | "));
  debugBox.textContent = lines.join("\n");
}, 1000);

// ===== イントロ再生 =====
async function playIntro(){
  log("=== playIntro 開始 ===");
  showScreen("intro");
  debugBox.style.display = "block";
  
  introVideo.src = "intro.mp4";
  introVideo.muted = true;
  introVideo.playsInline = true;
  introVideo.currentTime = 0;
  introVideo.load();
  log("intro.mp4 読み込み開始");
  
  // 再生
  try {
    await introVideo.play();
    log("intro 再生成功");
  } catch (err){
    log("intro 再生失敗: " + err.message);
    // 失敗しても次へ
    await sleep(500);
    showStartScreen();
    return;
  }
  
  // 終了を待つ
  await new Promise((resolve) => {
    let resolved = false;
    const finish = () => {
      if (resolved) return;
      resolved = true;
      introVideo.onended = null;
      introVideo.ontimeupdate = null;
      resolve();
    };
    introVideo.onended = finish;
    introVideo.ontimeupdate = () => {
      if (introVideo.duration && introVideo.currentTime >= introVideo.duration - 0.1){
        finish();
      }
    };
    setTimeout(finish, 20000);
  });
  
  log("intro 終了");
  showStartScreen();
}

// ===== 起動画面 =====
async function showStartScreen(){
  log("=== showStartScreen 開始 ===");
  showScreen("start");
  
  // 背景ループ
  startBgVideo.src = "library_loop.mp4";
  startBgVideo.muted = true;
  startBgVideo.playsInline = true;
  startBgVideo.loop = true;
  startBgVideo.currentTime = 0;
  startBgVideo.load();
  log("library_loop.mp4 読み込み開始");
  
  try {
    await startBgVideo.play();
    log("背景ループ 再生成功");
  } catch (err){
    log("背景ループ 失敗: " + err.message);
    // リトライ
    await sleep(500);
    try {
      await startBgVideo.play();
      log("背景ループ リトライ成功");
    } catch (err2){
      log("背景ループ リトライ失敗: " + err2.message);
    }
  }
  
  // UIフェードイン
  startUI.classList.remove("visible");
  setTimeout(() => {
    startUI.classList.add("visible");
    log("UI フェードイン");
  }, 300);
}

// ===== フォルダ選択（今はアラートのみ） =====
folderButton.onclick = () => {
  alert("フォルダ選択は未実装");
};

// ===== 起動 =====
playIntro();
</script>
</body>
</html>
