<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SHRIFT : CRISIS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000;color:#f0d0e8;
  font-family:'RocknRoll One',-apple-system,sans-serif;
}

#game{
  position:relative;
  width:100%;height:100dvh;
  max-width:480px;margin:0 auto;
  overflow:hidden;
}
@media (min-width: 768px){
  #game{ max-width:720px; }
}

.screen{
  position:absolute;inset:0;
  display:none;
}
.screen.active{display:block}

/* ===== イントロ画面 ===== */
#introScreen{
  background:#000;
  z-index:200;
}
#introVideo{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}

/* ===== 起動画面 ===== */
#startScreen{
  background:#000;
}
#startBgVideo{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  z-index:0;
  opacity:1;
}
#startUI{
  position:absolute;inset:0;
  z-index:2;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  opacity:0;
  transition:opacity 1.5s ease;
}
#startUI.visible{opacity:1}

#startUI h1{
  font-size:22px;
  color:#ff69b4;
  letter-spacing:4px;
  text-shadow:
    0 0 4px #000,
    0 0 8px #000,
    0 0 20px rgba(255,0,120,0.8);
  margin-bottom:12px;
}
#startUI p{
  font-size:12px;
  color:#ffcce6;
  letter-spacing:4px;
  margin-bottom:40px;
  opacity:0.95;
  text-shadow:
    0 0 4px #000,
    0 0 8px #000;
}
#folderButton{
  padding:16px 40px;
  border:1.5px solid #ff66aa;
  border-radius:4px;
  background:linear-gradient(180deg,#c01860,#500825);
  color:#fff;
  font-size:14px;font-weight:700;
  cursor:pointer;
  letter-spacing:2px;
  box-shadow:0 0 20px rgba(255,0,120,0.5);
}
#folderButton:active{transform:scale(0.97)}

#debugBox{
  position:fixed;bottom:6px;left:6px;right:6px;
  background:rgba(0,0,0,0.85);
  color:#0f0;
  font-size:10px;
  padding:6px;
  border-radius:4px;
  z-index:99999;
  font-family:monospace;
  line-height:1.4;
  white-space:pre-wrap;
  display:none;
}
</style>
</head>
<body>
<div id="game">

  <!-- ① イントロ画面 -->
  <div id="introScreen" class="screen active">
    <video id="introVideo" playsinline muted preload="auto"></video>
  </div>

  <!-- ② 起動画面 -->
  <div id="startScreen" class="screen">
    <video id="startBgVideo" muted loop playsinline preload="auto"></video>
    <div id="startUI">
      <h1>SHRIFT : CRISIS</h1>
      <p>物語を選んでください</p>
      <button id="folderButton">📁 フォルダを選択</button>
    </div>
  </div>

  <div id="debugBox"></div>
</div>

<script>
"use strict";

const introScreen = document.getElementById("introScreen");
const startScreen = document.getElementById("startScreen");
const introVideo = document.getElementById("introVideo");
const startBgVideo = document.getElementById("startBgVideo");
const startUI = document.getElementById("startUI");
const folderButton = document.getElementById("folderButton");
const debugBox = document.getElementById("debugBox");

function showScreen(name){
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  const el = document.getElementById(name + "Screen");
  if (el) el.classList.add("active");
}

function sleep(ms){
  return new Promise(r => setTimeout(r, ms));
}

function log(msg){
  console.log(msg);
  debugBox.style.display = "block";
  debugBox.textContent = msg;
}

// ===== イントロ再生 =====
async function playIntro(){
  showScreen("intro");
  
  // ★ 裏で背景読み込み開始
  startBgVideo.src = "library_loop.mp4";
  startBgVideo.muted = true;
  startBgVideo.playsInline = true;
  startBgVideo.loop = true;
  startBgVideo.load();
  
  // イントロ再生
  introVideo.src = "intro.mp4";
  introVideo.muted = true;
  introVideo.playsInline = true;
  introVideo.currentTime = 0;
  introVideo.load();
  
  try {
    await introVideo.play();
  } catch (err){
    console.warn("イントロ失敗:", err);
    await showStartScreen();
    return;
  }
  
  // 終了待ち
  await new Promise((resolve) => {
    let resolved = false;
    const finish = () => {
      if (resolved) return;
      resolved = true;
      introVideo.onended = null;
      introVideo.ontimeupdate = null;
      resolve();
    };
    introVideo.onended = finish;
    introVideo.ontimeupdate = () => {
      if (introVideo.duration && introVideo.currentTime >= introVideo.duration - 0.1){
        finish();
      }
    };
    setTimeout(finish, 30000);
  });
  
  await showStartScreen();
}

// ===== 起動画面 =====
async function showStartScreen(){
  // introVideo 解放
  try {
    introVideo.pause();
    introVideo.removeAttribute("src");
    introVideo.load();
  } catch (e){}
  
  showScreen("start");
  
  // 背景ループ（すでに読み込み済み）
  startBgVideo.currentTime = 0;
  try {
    await startBgVideo.play();
  } catch (err){
    console.warn("背景ループ失敗:", err);
    await sleep(300);
    await startBgVideo.play().catch(()=>{});
  }
  
  // UIフェードイン
  setTimeout(() => {
    startUI.classList.add("visible");
  }, 100);
}

// ===== フォルダ選択 =====
folderButton.onclick = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.webkitdirectory = true;
  input.directory = true;
  input.multiple = true;
  
  input.onchange = async (e) => {
    const files = Array.from(e.target.files);
    input.value = "";
    
    if (files.length === 0){
      log("ファイルが選択されませんでした");
      return;
    }
    
    const folderMap = {};
    files.forEach(f => {
      const relPath = f.webkitRelativePath || f.name;
      const parts = relPath.split("/");
      if (parts.length >= 3){
        const name = parts[1];
        if (!folderMap[name]) folderMap[name] = {};
        folderMap[name][parts.slice(2).join("/")] = f;
      }
    });
    
    const names = Object.keys(folderMap);
    log("敵フォルダ数: " + names.length + "\n" + names.join("\n"));
  };
  
  input.click();
};

// ===== 起動 =====
playIntro();
</script>

</body>
</html>
